# status.twentcode.com — Upptime (MIT, https://upptime.js.org), owner's choice 2026-11-24.
# Checks run from GitHub Actions every 5 minutes, outside our 3 servers, so the page stays up and honest when they are down.
# Source of truth: macbook-dev-server repo status-upptime/ (copied into Kidpech-code/status). Deploy steps: README.md.
owner: Kidpech-code
repo: status

# downtime opens a GitHub issue assigned here (GitHub emails the owner) and closes it on recovery
assignees:
  - Kidpech-code

# the repo's built-in Actions token (no personal token) may not edit topics or the description
skipTopicsUpdate: true
skipDescriptionUpdate: true

sites:
  - name: เว็บ Office AI
    slug: ai
    url: https://ai.twentcode.com
  - name: API โมเดลภาษา (llm.twentcode.com)
    slug: llm-api
    url: https://llm.twentcode.com/healthz
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    __dangerous__body_degraded: '"maintenance":true'
  - name: kidpech.app
    slug: kidpech-app
    url: https://kidpech.app
  - name: API ของ kidpech.app
    slug: kidpech-api
    url: https://api.kidpech.app/health
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  - name: ออฟฟิศออนไลน์ (office.twentcode.com)
    slug: office
    url: https://office.twentcode.com
  - name: แชต Matrix
    slug: matrix
    url: https://matrix.twentcode.com/_matrix/client/versions
  - name: Dev Office (office.kidpech.app)
    slug: dev-office
    url: https://office.kidpech.app
  - name: MyShift
    slug: my-shift
    url: https://my-shift.twentcode.com
  - name: MyShift อ่านตาราง (OCR)
    slug: my-shift-ocr
    url: https://my-shift.twentcode.com/__local-ocr/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  - name: twentcode.com
    slug: twentcode
    url: https://twentcode.com

status-website:
  cname: status.twentcode.com
  logoUrl: https://status.twentcode.com/favicon.svg
  favicon: https://status.twentcode.com/favicon.svg
  name: Twentcode Status
  introTitle: "สถานะบริการ Twentcode"
  introMessage: ตรวจจากภายนอกทุก 5 นาที · เหตุขัดข้องและการปิดปรับปรุงจะแสดงที่นี่พร้อมเวลาเริ่ม–จบ
  theme: light
  navbar:
    - title: สถานะ
      href: /
    - title: Office AI
      href: https://ai.twentcode.com
    - title: kidpech.app
      href: https://kidpech.app

